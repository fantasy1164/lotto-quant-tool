name: Daily Lottery Scraper and Predictor

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch: {}

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    # 將權限限縮並宣告在 Job 層級，解析更安全
    permissions:
      contents: write

    steps:
      # 1. 複製倉庫程式碼到虛擬機
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝爬蟲與機器學習所需的套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 numpy scikit-learn

      # 4. 執行腳本，產生全新的 data.json
      - name: Run script
        run: python update_data.py

      # 5. 將更新後的 data.json 提交並推回 GitHub 倉庫
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git diff-index --quiet HEAD || git commit -m "Automated daily update: $(date)"
          git push
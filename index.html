<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 多功能彩券模擬預測器</title>
    <style>
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background-color: #f8f9fa;
            color: #2c3e50;
        }
        h2 { color: #2c3e50; margin-bottom: 30px; }
        
        /* 下拉選單樣式 */
        select {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #3498db;
            outline: none;
            cursor: pointer;
            margin-bottom: 30px;
            width: 80%;
            max-width: 300px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 10px;
        }

        /* 各類球體樣式 */
        .ball {
            display: inline-block;
            width: 45px;
            height: 45px;
            background: #e74c3c; /* 預設大樂透/今彩539紅球 */
            color: white;
            border-radius: 50%;
            line-height: 45px;
            margin: 8px;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* 威力彩第二區特別球 (綠色) */
        .ball.super-special {
            background: #2ecc71;
        }

        /* 大樂透特別號 (黃色) */
        .ball.lotto-special {
            background: #f1c40f;
            color: #2c3e50;
        }

        /* 3/4星彩數字方塊 */
        .star-box {
            display: inline-block;
            width: 45px;
            height: 45px;
            background: #34495e;
            color: white;
            border-radius: 8px;
            line-height: 45px;
            margin: 8px;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .info {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h2>🤖 AI 電腦型彩券預測模擬器</h2>
    
    <select id="lottery-select" onchange="renderPrediction()">
        <option value="">載入數據中...</option>
    </select>
    
    <div class="card" id="display-card" style="display:none;">
        <h3 id="lottery-title">---</h3>
        <div id="numbers-container"></div>
        <p class="info">最後更新時間: <span id="update-time"></span></p>
    </div>

    <script>
        let globalData = null;

        // 1. 讀取 GitHub Actions 自動產生的 data.json
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                globalData = data;
                document.getElementById('update-time').innerText = data.last_updated;
                
                // 動態初始化下拉選單
                const select = document.getElementById('lottery-select');
                select.innerHTML = ''; // 清空 loading
                
                Object.keys(data.predictions).forEach(key => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.innerText = data.predictions[key].name;
                    select.appendChild(opt);
                });

                // 預設顯示第一個產品
                document.getElementById('display-card').style.display = 'block';
                renderPrediction();
            })
            .catch(err => {
                const select = document.getElementById('lottery-select');
                select.innerHTML = '<option>無法載入最新數據</option>';
                console.error(err);
            });

        // 2. 渲染對應彩券的預測號碼
        function renderPrediction() {
            if (!globalData) return;
            
            const selectedKey = document.getElementById('lottery-select').value;
            const pred = globalData.predictions[selectedKey];
            
            document.getElementById('lottery-title').innerText = `${pred.name} 推薦號碼`;
            
            const container = document.getElementById('numbers-container');
            container.innerHTML = ''; // 清空舊球

            // 根據不同彩券類型渲染球體
            if (pred.style === 'stars') {
                // 3星彩 / 4星彩：渲染成方塊
                pred.numbers.forEach(num => {
                    const el = document.createElement('span');
                    el.className = 'star-box';
                    el.innerText = num;
                    container.appendChild(el);
                });
            } else {
                // 大樂透、威力彩、今彩539：渲染成圓球
                pred.numbers.forEach(num => {
                    const el = document.createElement('span');
                    el.className = 'ball';
                    el.innerText = String(num).padStart(2, '0'); // 補零美化，如 03, 12
                    container.appendChild(el);
                });

                // 處理特別號/第二區
                if (pred.special !== null) {
                    const spEl = document.createElement('span');
                    
                    if (pred.style === 'super_lotto') {
                        spEl.className = 'ball super-special'; // 威力彩第二區 (綠)
                    } else if (pred.style === 'lotto') {
                        spEl.className = 'ball lotto-special'; // 大樂透特別號 (黃)
                    }
                    
                    spEl.innerText = String(pred.special).padStart(2, '0');
                    container.appendChild(spEl);
                }
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 電腦型彩券預測儀表板</title>
    <style>
        :root {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary-red: #ef4444;
            --special-yellow: #f59e0b;
            --special-green: #10b981;
            --star-blue: #475569;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            margin: 0 0 12px 0;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.05rem;
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-top: 60px;
            font-weight: 500;
        }

        /* 全螢幕響應式網格 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 數據卡片設計 */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.07);
        }

        .card h3 {
            margin: 0 0 20px 0;
            font-size: 1.5rem;
            font-weight: 700;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card h3::after {
            content: "ML 演算中";
            font-size: 0.75rem;
            background: #f0fdf4;
            color: #166534;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .details-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 演算數據單列排版 */
        .prediction-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #f8fafc;
        }

        .ball-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 55%;
        }

        /* 球體樣式 */
        .ball {
            display: inline-block;
            width: 38px;
            height: 38px;
            background: var(--primary-red);
            color: white;
            border-radius: 50%;
            line-height: 38px;
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.15);
            flex-shrink: 0;
        }

        /* 3/4星彩數字方塊 */
        .ball.star {
            background: var(--star-blue);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(71, 85, 105, 0.15);
        }

        .omission-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 特徵冷熱標籤 */
        .status-badge {
            font-size: 0.72rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }
        .badge-hot { background: #fee2e2; color: #ef4444; }
        .badge-cold { background: #e0f2fe; color: #0284c7; }

        /* 機率進度條 */
        .prob-meta {
            width: 40%;
            text-align: right;
        }

        .prob-percent {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
            font-family: monospace;
        }

        .progress-container {
            background: #e2e8f0;
            height: 6px;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #3b82f6, #10b981);
            height: 100%;
            border-radius: 3px;
            width: 0%;
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 特別號專用面板 */
        .special-panel {
            margin-top: 18px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px dashed var(--border-color);
        }

        .special-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .special-ball {
            display: inline-block;
            width: 40px;
            height: 40px;
            color: white;
            border-radius: 50%;
            line-height: 40px;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .special-ball.lotto { background: var(--special-yellow); color: #1e293b; }
        .special-ball.super { background: var(--special-green); }
    </style>
</head>
<body>

    <header>
        <h1>🤖 AI 電腦型彩券預測儀表板</h1>
        <p>數據更新排程：每日自動運行 • <span id="update-time">載入中...</span></p>
    </header>

    <div id="loading">正在讀取真實歷史開獎數據與訓練模型結果...</div>
    
    <div class="grid-container" id="lottery-grid"></div>

    <script>
        // 非同步載入 Actions 生成的資料
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('update-time').innerText = `最後更新: ${data.last_updated}`;
                
                const grid = document.getElementById('lottery-grid');
                grid.innerHTML = ''; 

                // 遍歷所有商品
                Object.keys(data.predictions).forEach(key => {
                    const product = data.predictions[key];
                    
                    const card = document.createElement('div');
                    card.className = 'card';

                    // 1. 卡片標題
                    const title = document.createElement('h3');
                    title.innerText = product.name;
                    card.appendChild(title);

                    // 2. 演算詳情容器
                    const detailsBox = document.createElement('div');
                    detailsBox.className = 'details-box';

                    product.numbers.forEach(item => {
                        const row = document.createElement('div');
                        row.className = 'prediction-row';

                        // 計算冷熱標籤
                        let tagHtml = '';
                        if (item.count_20 >= 4) {
                            tagHtml = '<span class="status-badge badge-hot">🔥熱</span>';
                        } else if (item.count_20 <= 1) {
                            tagHtml = '<span class="status-badge badge-cold">❄️冷</span>';
                        }

                        // 判斷是否為三星/四星彩的方塊樣式
                        const isStar = product.style === 'stars';
                        const ballText = isStar ? item.number : String(item.number).padStart(2, '0');
                        const ballClass = isStar ? 'ball star' : 'ball';

                        row.innerHTML = `
                            <div class="ball-meta">
                                <span class="${ballClass}">${ballText}</span>
                                ${tagHtml}
                                <span class="omission-badge">漏 ${item.omission} 期</span>
                            </div>
                            <div class="prob-meta">
                                <span class="prob-percent">${(item.probability * 100).toFixed(1)}%</span>
                                <div class="progress-container">
                                    <div class="progress-bar" data-width="${item.probability * 100}"></div>
                                </div>
                            </div>
                        `;
                        detailsBox.appendChild(row);
                    });
                    card.appendChild(detailsBox);

                    // 3. 渲染特別號區塊（如果該彩券有特別號）
                    if (product.special !== null) {
                        const specialPanel = document.createElement('div');
                        specialPanel.className = 'special-panel';
                        
                        const spTitle = document.createElement('span');
                        spTitle.className = 'special-title';
                        spTitle.innerText = product.style === 'super_lotto' ? 'AI 推薦第二區號碼' : 'AI 推薦特別號';
                        
                        const spBall = document.createElement('span');
                        spBall.className = `special-ball ${product.style === 'super_lotto' ? 'super' : 'lotto'}`;
                        spBall.innerText = String(product.special).padStart(2, '0');

                        specialPanel.appendChild(spTitle);
                        specialPanel.appendChild(spBall);
                        card.appendChild(specialPanel);
                    }

                    grid.appendChild(card);
                });

                // 動態觸發進度條動畫
                setTimeout(() => {
                    document.querySelectorAll('.progress-bar').forEach(bar => {
                        const targetWidth = bar.getAttribute('data-width');
                        bar.style.width = `${targetWidth}%`;
                    });
                }, 100);
            })
            .catch(err => {
                document.getElementById('loading').innerText = '數據讀取失敗，請確認 data.json 是否順利生成。';
                console.error(err);
            });
    </script>
</body>
</html>
